version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: codereview_secret
      POSTGRES_DB: codereview
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://codereview:codereview_secret@db:5432/codereview
      API_HOST: 0.0.0.0
      API_PORT: 8765
      LOG_LEVEL: INFO
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-off}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "8765:8765"
    volumes:
      - appdata:/app/data
    command: python main.py --no-ui

volumes:
  pgdata:
  appdata:
